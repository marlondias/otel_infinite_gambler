services:
  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "13133:13133" # health_check extension
    volumes:
      - ./.docker/otel_collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - infinite_gambler_net

  loki:
    image: grafana/loki:3.7.3
    restart: unless-stopped
    user: "10001:10001" # Recommended non-root UID
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -target=all
    ports:
      - "3100:3100" # HTTP API + push endpoint
    volumes:
      - loki_data:/loki
      - ./.docker/loki/config.yaml:/etc/loki/loki-config.yaml:ro
    networks:
      - infinite_gambler_net

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=10d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--web.enable-otlp-receiver"
    environment:
      - TZ=UTC
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./.docker/prometheus/config.yaml:/etc/prometheus/prometheus.yaml:ro
    networks:
      - infinite_gambler_net

  grafana:
    image: grafana/grafana:13.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_SECRET_KEY: "${GF_SECURITY_SECRET_KEY}"
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./.docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - infinite_gambler_net

volumes:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  infinite_gambler_net:
    driver: bridge
